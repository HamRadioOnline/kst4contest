name: Tagged Release Build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Same job as in pr-compile-check.yml, copied rather than shared: a reusable workflow
  # would be one more indirection to read, and the comments belong next to the steps they
  # explain. Every packaging job below needs this one, so a commit whose tests fail builds
  # no artifact (#62). Edit all three copies together -- except for the tag check
  # right after the checkout, which only makes sense here.
  test:
    name: Test (Java 21, headless)
    runs-on: ubuntu-latest
    # A healthy run takes about four minutes. The per-test limit in build.gradle.kts names
    # a hanging test; this cap covers a hang outside any test, such as in Gradle itself.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # composePackageVersion is the package version of every Compose target format,
      # and the Linux package release below is derived from the tag alone. A tag that
      # names a different X.Y.Z than gradle.properties would therefore ship packages
      # whose version contradicts their file name and upgrade order (#113). Fail
      # before the tests rather than after an hour of packaging. Skipped for
      # workflow_dispatch, where the ref is a branch and carries no version.
      - name: Verify the tag matches composePackageVersion
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            TAG_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$REF_NAME" =~ ^beta-v([0-9]+\.[0-9]+\.[0-9]+)-.+$ ]]; then
            TAG_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag '$REF_NAME' is neither vX.Y.Z nor beta-vX.Y.Z-<suffix>, so it carries no package version"
            exit 1
          fi
          PROPERTY_VERSION="$(sed -n 's/^composePackageVersion=//p' gradle.properties)"
          if [[ "$TAG_VERSION" != "$PROPERTY_VERSION" ]]; then
            echo "::error::Tag $REF_NAME names version $TAG_VERSION, but gradle.properties has composePackageVersion=$PROPERTY_VERSION. Bump composePackageVersion (and version) before tagging, or move the tag."
            exit 1
          fi
          echo "Tag $REF_NAME matches composePackageVersion=$PROPERTY_VERSION"

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # Skiko's native library links against libGL, so it has to be loadable even though
      # nothing here renders through it: the drawing tests use Skia's software backend and
      # runComposeUiTest never opens a window. Without this the whole Compose half of the
      # suite dies with "libskiko-linux-x64.so: libGL.so.1: cannot open shared object
      # file" -- which reads like a missing display and is not one. Found by running this
      # job under act, where the container has no libGL; GitHub's own runner image happens
      # to ship it, so the step is what makes the job reproducible off GitHub.
      - name: Install the OpenGL client library skiko links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1

      # No Xvfb, deliberately. Everything that pins behaviour runs without a display:
      # runComposeUiTest reaches the semantics tree headless (measured before this job was
      # written), and the ImageComposeScene drawing tests render in software. The handful
      # of tests that open a real window guard themselves with assumeFalse(isHeadless) and
      # skip here; the summary below prints the skip count, so that is visible rather than
      # assumed.
      #
      # Software GL under Xvfb was considered and rejected: a missing Skia GL context is
      # the hardest failure in this codebase to read, and importing that class of flake
      # into CI would cost more than the few window tests are worth here.

      # All three modules. The translation generator is a Gradle module and not buildSrc
      # precisely so that its 42 tests run here: buildSrc tests do not run on `./gradlew
      # build` -- measured, not assumed. The summary below globs */build/test-results, so
      # the module was counted the moment it existed.
      - name: Test
        run: ./gradlew -S test

      - name: Summarise the test results
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*/build/test-results/test/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No test result XML was produced -- the test task did not run." >&2
            exit 1
          fi
          # Counted from the XML and not from Gradle's console output: this project's own
          # rule is never to infer "all tests passed" from an exit code.
          summary=$(grep -h "<testsuite " "${files[@]}" \
            | sed 's/.*tests="\([0-9]*\)".*skipped="\([0-9]*\)".*failures="\([0-9]*\)".*errors="\([0-9]*\)".*/\1 \2 \3 \4/' \
            | awk '{t+=$1; s+=$2; f+=$3; e+=$4} END {print t" "s" "f" "e}')
          read -r total skipped failures errors <<< "$summary"
          echo "tests=$total skipped=$skipped failures=$failures errors=$errors"
          {
            echo "### Tests"
            echo ""
            echo "| total | skipped | failures | errors |"
            echo "|---|---|---|---|"
            echo "| $total | $skipped | $failures | $errors |"
            echo ""
            echo "Skipped are the tests that need a display, plus the deliberately"
            echo "disabled reference-data generator. This job runs headless on purpose."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failures" != "0" ] || [ "$errors" != "0" ]; then
            echo "The result XML reports failures or errors." >&2
            exit 1
          fi

      - name: Keep the test reports on a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            */build/test-results/test/
            */build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

  build-windows-zip:
    name: Build Windows ZIP and MSI
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Build app-image
        shell: pwsh
        run: |
          .\gradlew.bat -S :app-desktop:createDistributable
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # The next step reads dist/KST4Contest, so the Compose output goes
          # there. The module list now lives in app-desktop/build.gradle.kts.
          if (Test-Path dist/KST4Contest) { Remove-Item -Recurse -Force dist/KST4Contest }
          Copy-Item -Recurse app-desktop/build/compose/binaries/main/app/KST4Contest dist/KST4Contest

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path dist/KST4Contest)) {
            throw "No Windows app-image produced by createDistributable"
          }
          Compress-Archive -Path dist/KST4Contest -DestinationPath dist/praktiKST-${{ github.ref_name }}-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: dist/praktiKST-${{ github.ref_name }}-windows-x64.zip

      # Stable tags only (issue #61): the MSI carries composePackageVersion
      # from gradle.properties, so a nightly or beta MSI would have the same
      # version as the following stable one. Windows Installer refuses to
      # install an equal version over the installed one (jpackage's upgrade
      # table only accepts strictly higher versions), so a beta tester could
      # not move to the stable without uninstalling first. Betas and nightlies
      # therefore stay ZIP-only. jpackage needs WiX 3.x, installed above. The
      # ZIP is unchanged and stays alongside.
      - name: Build Windows MSI installer
        if: ${{ !startsWith(github.ref_name, 'beta-') }}
        shell: pwsh
        run: |
          .\gradlew.bat -S :app-desktop:packageMsi
          $msi = Get-ChildItem -Path app-desktop/build/compose/binaries/main/msi -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) {
            throw "No Windows MSI produced by packageMsi"
          }
          Copy-Item $msi.FullName dist/KST4Contest-${{ github.ref_name }}-windows-x64.msi

      - name: Upload Windows MSI artifact
        if: ${{ !startsWith(github.ref_name, 'beta-') }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: dist/KST4Contest-${{ github.ref_name }}-windows-x64.msi

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build app-image
        run: |
          ./gradlew -S :app-desktop:createDistributable
          mkdir -p dist
          # The following steps read dist/KST4Contest, so the Compose output goes
          # there. The module list now lives in app-desktop/build.gradle.kts.
          rm -rf dist/KST4Contest
          cp -a app-desktop/build/compose/binaries/main/app/KST4Contest dist/

      - name: Create AppDir metadata
        run: |
          mkdir -p target
          rm -rf target/KST4Contest.AppDir
          cp -a dist/KST4Contest target/KST4Contest.AppDir

          cat > target/KST4Contest.AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/bin/KST4Contest" "$@"
          EOF
          chmod +x target/KST4Contest.AppDir/AppRun

          cat > target/KST4Contest.AppDir/KST4Contest.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=KST4Contest
          Exec=KST4Contest
          Icon=KST4Contest
          Categories=Network;HamRadio;
          Terminal=false
          EOF

          if [ -f target/KST4Contest.AppDir/lib/KST4Contest.png ]; then
            cp target/KST4Contest.AppDir/lib/KST4Contest.png target/KST4Contest.AppDir/KST4Contest.png
          fi

      - name: Build AppImage
        run: |
          mkdir -p target
          wget -q -O target/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x target/appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 target/appimagetool.AppImage target/KST4Contest.AppDir dist/KST4Contest-${{ github.ref_name }}-linux-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/KST4Contest-${{ github.ref_name }}-linux-x86_64.AppImage

  build-linux-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fakeroot

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # rpm and dpkg refuse to replace a package by one of equal version, and the
      # version is composePackageVersion for beta and stable alike. The package
      # RELEASE number tells them apart, following the Fedora pre-release convention:
      #   beta-v1.50.0-beta-001 -> 1.50.0-0.beta.001, beta-v1.50.0-rc02 -> 1.50.0-0.rc02,
      #   v1.50.0 -> 1.50.0-1. Everything starting with "0." sorts below "1", so the
      # stable installs as an upgrade over any beta (#113). The beta part is the tag
      # remainder after beta-vX.Y.Z- with "-" turned into "."; rpm and dpkg accept
      # only [A-Za-z0-9.] there, anything else fails this step. nightly-artifacts.yml
      # does not set the property and keeps release 1, as do local builds.
      - name: Derive the Linux package release from the tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "tag" ]]; then
            RELEASE="1"
          elif [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE="1"
          elif [[ "$REF_NAME" =~ ^beta-v[0-9]+\.[0-9]+\.[0-9]+-(.+)$ ]]; then
            RELEASE="0.${BASH_REMATCH[1]//-/.}"
          else
            echo "::error::Tag '$REF_NAME' is neither vX.Y.Z nor beta-vX.Y.Z-<suffix>, so no package release can be derived"
            exit 1
          fi
          if [[ ! "$RELEASE" =~ ^[A-Za-z0-9.]+$ ]]; then
            echo "::error::Derived package release '$RELEASE' contains characters rpm and dpkg do not accept"
            exit 1
          fi
          echo "Linux package release for $REF_NAME: $RELEASE"
          echo "LINUX_APP_RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Build Debian package
        run: |
          ./gradlew -S :app-desktop:packageDeb -PlinuxAppRelease="$LINUX_APP_RELEASE"
          mkdir -p dist
          DEB="$(ls app-desktop/build/compose/binaries/main/deb/*.deb | head -n 1)"
          if [ -z "$DEB" ]; then
            echo "No DEB produced by packageDeb" && exit 1
          fi
          mv "$DEB" "dist/KST4Contest-${{ github.ref_name }}-debian-amd64.deb"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-debian
          path: dist/KST4Contest-${{ github.ref_name }}-debian-amd64.deb

  build-linux-rpm:
    name: Build Fedora package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # rpm and dpkg refuse to replace a package by one of equal version, and the
      # version is composePackageVersion for beta and stable alike. The package
      # RELEASE number tells them apart, following the Fedora pre-release convention:
      #   beta-v1.50.0-beta-001 -> 1.50.0-0.beta.001, beta-v1.50.0-rc02 -> 1.50.0-0.rc02,
      #   v1.50.0 -> 1.50.0-1. Everything starting with "0." sorts below "1", so the
      # stable installs as an upgrade over any beta (#113). The beta part is the tag
      # remainder after beta-vX.Y.Z- with "-" turned into "."; rpm and dpkg accept
      # only [A-Za-z0-9.] there, anything else fails this step. nightly-artifacts.yml
      # does not set the property and keeps release 1, as do local builds.
      - name: Derive the Linux package release from the tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "tag" ]]; then
            RELEASE="1"
          elif [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE="1"
          elif [[ "$REF_NAME" =~ ^beta-v[0-9]+\.[0-9]+\.[0-9]+-(.+)$ ]]; then
            RELEASE="0.${BASH_REMATCH[1]//-/.}"
          else
            echo "::error::Tag '$REF_NAME' is neither vX.Y.Z nor beta-vX.Y.Z-<suffix>, so no package release can be derived"
            exit 1
          fi
          if [[ ! "$RELEASE" =~ ^[A-Za-z0-9.]+$ ]]; then
            echo "::error::Derived package release '$RELEASE' contains characters rpm and dpkg do not accept"
            exit 1
          fi
          echo "Linux package release for $REF_NAME: $RELEASE"
          echo "LINUX_APP_RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Build Fedora package
        run: |
          ./gradlew -S :app-desktop:packageRpm -PlinuxAppRelease="$LINUX_APP_RELEASE"
          mkdir -p dist
          RPM="$(ls app-desktop/build/compose/binaries/main/rpm/*.rpm | head -n 1)"
          if [ -z "$RPM" ]; then
            echo "No RPM produced by packageRpm" && exit 1
          fi
          mv "$RPM" "dist/KST4Contest-${{ github.ref_name }}-fedora-x86_64.rpm"

      - name: Upload Fedora artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-fedora
          path: dist/KST4Contest-${{ github.ref_name }}-fedora-x86_64.rpm

  build-linux-arch:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build app-image
        run: |
          ./gradlew -S :app-desktop:createDistributable
          mkdir -p dist
          # The following steps read dist/KST4Contest, so the Compose output goes
          # there. The module list now lives in app-desktop/build.gradle.kts.
          rm -rf dist/KST4Contest
          cp -a app-desktop/build/compose/binaries/main/app/KST4Contest dist/

      - name: Build Arch Linux package artifact
        run: |
          mkdir -p target
          ARCH=$(uname -m)
          PKGVER=$(printf '%s' "${{ github.ref_name }}" | sed 's/[^[:alnum:].+_]/_/g')
          PKGROOT="target/archpkg"
          rm -rf "$PKGROOT"
          mkdir -p "$PKGROOT/usr/lib/KST4Contest" "$PKGROOT/usr/bin"
          cp -a dist/KST4Contest/. "$PKGROOT/usr/lib/KST4Contest/"
          cat > "$PKGROOT/usr/bin/KST4Contest" << 'EOF'
          #!/bin/sh
          exec /usr/lib/KST4Contest/bin/KST4Contest "$@"
          EOF
          chmod 755 "$PKGROOT/usr/bin/KST4Contest"
          mkdir -p "$PKGROOT/usr/share/applications" "$PKGROOT/usr/share/icons/hicolor/256x256/apps"
          cat > "$PKGROOT/usr/share/applications/KST4Contest.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=KST4Contest
          Comment=ON4KST Chat Client for VHF/UHF contest operation
          Exec=KST4Contest
          Icon=KST4Contest
          Categories=Network;HamRadio;
          Terminal=false
          EOF
          if [ -f "$PKGROOT/usr/lib/KST4Contest/lib/KST4Contest.png" ]; then
            cp "$PKGROOT/usr/lib/KST4Contest/lib/KST4Contest.png" "$PKGROOT/usr/share/icons/hicolor/256x256/apps/KST4Contest.png"
          fi
          INSTALLED_SIZE=$(du -sb "$PKGROOT" | cut -f1)
          BUILDDATE=$(date +%s)
          WORKFLOW_SHA256=$(sha256sum "$GITHUB_WORKSPACE/.github/workflows/tagged-release.yml" | awk '{print $1}')
          {
            echo "pkgname = kst4contest"
            echo "pkgbase = kst4contest"
            echo "xdata = pkgtype=pkg"
            echo "pkgver = ${PKGVER}-1"
            echo "pkgdesc = KST4Contest amateur radio contest logger"
            echo "url = https://github.com/${{ github.repository }}"
            echo "builddate = ${BUILDDATE}"
            echo "packager = GitHub Actions"
            echo "size = ${INSTALLED_SIZE}"
            echo "arch = ${ARCH}"
            echo "license = custom"
            echo "depend = java-runtime"
            echo "depend = gst-plugins-base"
            echo "depend = gst-plugins-good"
          } > "$PKGROOT/.PKGINFO"
          {
            echo "format = 2"
            echo "pkgname = kst4contest"
            echo "pkgbase = kst4contest"
            echo "pkgver = ${PKGVER}-1"
            echo "pkgarch = ${ARCH}"
            echo "pkgbuild_sha256sum = ${WORKFLOW_SHA256}"
            echo "packager = GitHub Actions"
            echo "builddate = ${BUILDDATE}"
            echo "builddir = /build"
            echo "startdir = /build"
            echo "buildtool = makepkg"
            echo "buildtoolver = 7.0.0-1-x86_64"
            echo "buildenv = !distcc !color !ccache check !sign"
            echo "options = !strip docs libtool staticlibs emptydirs zipman purge !debug !lto"
          } > "$PKGROOT/.BUILDINFO"
          tar --zstd --transform 's|^\./||' -cf "dist/KST4Contest-${{ github.ref_name }}-archlinux-${ARCH}.pkg.tar.zst" -C "$PKGROOT" .

      - name: Upload Arch Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arch
          path: dist/KST4Contest-${{ github.ref_name }}-archlinux-*.pkg.tar.zst

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build app-image
        run: |
          ./gradlew -S :app-desktop:createDistributable
          mkdir -p target/flatpak-src
          # The manifest's source is flatpak-src/KST4Contest.
          rm -rf target/flatpak-src/KST4Contest
          cp -a app-desktop/build/compose/binaries/main/app/KST4Contest target/flatpak-src/

      - name: Create Flatpak manifest
        run: |
          mkdir -p target
          mkdir -p dist
          cat > target/de.x08.KST4Contest.yml << 'EOF'
          app-id: de.x08.KST4Contest
          runtime: org.freedesktop.Platform
          runtime-version: "25.08"
          sdk: org.freedesktop.Sdk
          command: KST4Contest
          finish-args:
            - --socket=wayland
            - --socket=x11
            - --socket=pulseaudio
            - --share=network
            - --share=ipc
            - --device=dri
            - --filesystem=~/.praktiKST
            - --env=ALSA_CONFIG_PATH=/app/share/alsa/asound.conf
          modules:
            - name: kst4contest
              buildsystem: simple
              build-commands:
                - install -d /app/lib/KST4Contest /app/bin /app/share/applications /app/share/alsa
                - printf '@include /usr/share/alsa/alsa.conf\npcm.!default { type pulse }\nctl.!default { type pulse }\n' > /app/share/alsa/asound.conf
                - cp -a . /app/lib/KST4Contest/
                - printf '#!/bin/sh\nexec /app/lib/KST4Contest/bin/KST4Contest "$@"\n' > /app/bin/KST4Contest
                - chmod 755 /app/bin/KST4Contest
                - echo '[Desktop Entry]' > /app/share/applications/de.x08.KST4Contest.desktop
                - echo 'Type=Application' >> /app/share/applications/de.x08.KST4Contest.desktop
                - echo 'Name=KST4Contest' >> /app/share/applications/de.x08.KST4Contest.desktop
                - echo 'Comment=ON4KST Chat Client for VHF/UHF contest operation' >> /app/share/applications/de.x08.KST4Contest.desktop
                - echo 'Exec=KST4Contest' >> /app/share/applications/de.x08.KST4Contest.desktop
                - echo 'Icon=de.x08.KST4Contest' >> /app/share/applications/de.x08.KST4Contest.desktop
                - printf 'Categories=Network;HamRadio;\n' >> /app/share/applications/de.x08.KST4Contest.desktop
                - echo 'Terminal=false' >> /app/share/applications/de.x08.KST4Contest.desktop
                - test -f /app/lib/KST4Contest/lib/KST4Contest.png && install -Dm644 /app/lib/KST4Contest/lib/KST4Contest.png /app/share/icons/hicolor/256x256/apps/de.x08.KST4Contest.png || true
              sources:
                - type: dir
                  path: flatpak-src/KST4Contest
          EOF

      - name: Import Flatpak signing key
        run: |
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import
          FLATPAK_GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "FLATPAK_GPG_KEY_ID=$FLATPAK_GPG_KEY_ID" >> "$GITHUB_ENV"

      - name: Determine OSTree branch and flatpakref filename
        run: |
          if [[ "${{ github.ref_name }}" == beta-* ]]; then
            echo "OSTREE_BRANCH=beta" >> "$GITHUB_ENV"
            echo "FLATPAKREF_NAME=de.x08.KST4Contest.beta.flatpakref" >> "$GITHUB_ENV"
          else
            echo "OSTREE_BRANCH=stable" >> "$GITHUB_ENV"
            echo "FLATPAKREF_NAME=de.x08.KST4Contest.flatpakref" >> "$GITHUB_ENV"
          fi

      - name: Build Flatpak repo
        run: |
          mkdir -p target
          flatpak-builder --force-clean target/flatpak-build target/de.x08.KST4Contest.yml
          flatpak build-export --gpg-sign="$FLATPAK_GPG_KEY_ID" target/flatpak-repo target/flatpak-build "$OSTREE_BRANCH"
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY_ID" target/flatpak-repo

      - name: Create flatpakref
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${REPO_NAME}/"
          GPG_KEY_B64=$(gpg --export "$FLATPAK_GPG_KEY_ID" | base64 -w 0)
          cat > "dist/${FLATPAKREF_NAME}" << EOF
          [Flatpak Ref]
          Name=de.x08.KST4Contest
          Branch=${OSTREE_BRANCH}
          Title=KST4Contest (${{ startsWith(github.ref_name, 'beta-') && 'Beta' || 'Release' }}) – ON4KST Chat Client
          Url=${PAGES_URL}
          RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo
          GPGKey=${GPG_KEY_B64}
          IsRuntime=false
          EOF

      - name: Upload flatpakref
        uses: actions/upload-artifact@v7
        with:
          name: flatpakref
          path: dist/*.flatpakref

      - name: Upload Flatpak OSTree repo
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-ostree-repo
          path: target/flatpak-repo/

  build-macos-dmg:
    name: Build macOS DMG (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./packaging/macos/ci-import-cert.sh

      # Builds the jar, signs the app bundle and every native library inside it,
      # wraps it into a DMG and has Apple notarize the result. Same script the
      # local Mac uses, so the two cannot drift apart.
      - name: Build signed and notarized DMG
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          ./packaging/macos/build-signed-dmg.sh

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Rename DMG artifact
        run: |
          ARCH=$(uname -m)
          DMG=$(ls dist/*.dmg | head -n 1)
          if [ -z "$DMG" ]; then
            echo "No DMG produced by the build" && exit 1
          fi
          mv "$DMG" "dist/KST4Contest-${{ github.ref_name }}-macos-${ARCH}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg-${{ matrix.os }}
          path: dist/KST4Contest-${{ github.ref_name }}-macos-*.dmg

  build-docs-pdf:
    name: Build Documentation PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pandoc and LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-plain-generic

      - name: Build English PDF manual
        run: |
          mkdir -p dist
          pandoc \
            --from=markdown-yaml_metadata_block \
            --template=.github/latex-manual/manual-template.tex \
            --pdf-engine=xelatex \
            --lua-filter=.github/latex-manual/strip-wiki-links.lua \
            --resource-path=.:github_docs \
            --listings \
            --toc \
            --toc-depth=3 \
            -V title="User Manual" \
            -V polyglossia-lang=english \
            -V version="${{ github.ref_name }}" \
            -o dist/KST4Contest-${{ github.ref_name }}-manual-en.pdf \
            github_docs/en-Home.md \
            github_docs/en-Installation.md \
            github_docs/en-Configuration.md \
            github_docs/en-Features.md \
            github_docs/en-User-Interface.md \
            github_docs/en-Macros-and-Variables.md \
            github_docs/en-Log-Sync.md \
            github_docs/en-AirScout-Integration.md \
            github_docs/en-DX-Cluster-Server.md \
            github_docs/en-Changelog.md

      - name: Build German PDF manual
        run: |
          pandoc \
            --from=markdown-yaml_metadata_block \
            --template=.github/latex-manual/manual-template.tex \
            --pdf-engine=xelatex \
            --lua-filter=.github/latex-manual/strip-wiki-links.lua \
            --resource-path=.:github_docs \
            --listings \
            --toc \
            --toc-depth=3 \
            -V title="Benutzerhandbuch" \
            -V polyglossia-lang=german \
            -V version="${{ github.ref_name }}" \
            -o dist/KST4Contest-${{ github.ref_name }}-manual-de.pdf \
            github_docs/de-Home.md \
            github_docs/de-Installation.md \
            github_docs/de-Konfiguration.md \
            github_docs/de-Funktionen.md \
            github_docs/de-Benutzeroberflaeche.md \
            github_docs/de-Makros-und-Variablen.md \
            github_docs/de-Log-Synchronisation.md \
            github_docs/de-AirScout-Integration.md \
            github_docs/de-DX-Cluster-Server.md \
            github_docs/de-Changelog.md

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs-pdf
          path: dist/KST4Contest-${{ github.ref_name }}-manual-*.pdf

  publish-flatpak-repo:
    name: Publish Flatpak OSTree Repo (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: build-flatpak
    concurrency:
      group: flatpak-repo-publish
      cancel-in-progress: false

    steps:
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak

      - name: Import Flatpak signing key
        run: |
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "FLATPAK_GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Download OSTree repo artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: flatpak-ostree-repo
          path: flatpak-ostree-repo/

      - name: Checkout existing flatpak-repo branch
        uses: actions/checkout@v7
        with:
          ref: flatpak-repo
          path: existing-flatpak-repo

      - name: Merge build into flatpak-repo
        run: |
          cd existing-flatpak-repo
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          rsync -a ../flatpak-ostree-repo/ ./
          # Regenerate summary with all branches (not just the one just built)
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY_ID" .
          # Generate .flatpakrepo with embedded GPG key so users can do remote-add without errors
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${REPO_NAME}/"
          GPG_KEY_B64=$(gpg --export "$FLATPAK_GPG_KEY_ID" | base64 -w 0)
          cat > kst4contest.flatpakrepo << EOF
          [Flatpak Repo]
          Title=KST4Contest
          Url=${PAGES_URL}
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Comment=KST4Contest – ON4KST Chat Client for VHF/UHF contests
          GPGKey=${GPG_KEY_B64}
          EOF
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Flatpak repo: ${{ github.ref_name }}"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:flatpak-repo
          fi

  release-tag:
    name: Publish Tagged Release
    runs-on: ubuntu-latest
    needs:
      - build-windows-zip
      - build-linux-appimage
      - build-linux-deb
      - build-linux-rpm
      - build-linux-arch
      - build-macos-dmg
      - build-flatpak
      - build-docs-pdf
      - publish-flatpak-repo

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          # Full history and tags, needed to list the commits since the previous release.
          fetch-depth: 0

      # GitHub's generated release notes list merged pull requests only. Commits
      # pushed directly to main are added here as their own section, and the
      # message of an annotated tag opens the body:
      #   <tag message>          (annotated tags only; signature dropped)
      #   ## What's Changed
      #   ### Commits on main   (first-parent commits, no merges, no bots)
      #   ### Merged PRs        (GitHub's generated PR list)
      # The body also feeds the in-app update feed (website/src/_data/versionInfo.js,
      # cleanReleaseBody), which drops headings and keeps the "* ..." lines.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Stable releases compare against the previous stable release, betas
          # against the previous tag of any kind.
          if [[ "$TAG" == beta-* ]]; then
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          else
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 --exclude 'beta-*' "${TAG}^" 2>/dev/null || true)"
          fi
          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"

          RANGE="$TAG"
          [ -n "$PREVIOUS_TAG" ] && RANGE="${PREVIOUS_TAG}..${TAG}"

          # actions/checkout can leave the triggering tag as a lightweight ref, so
          # fetch the tag object itself before reading its message.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          # A lightweight tag has no message of its own (its "message" would be the
          # commit's); only an annotated tag contributes. contents:subject and
          # contents:body leave out an SSH or GPG signature.
          : > tag-message.md
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = "tag" ]; then
            git for-each-ref "refs/tags/${TAG}" \
              --format='%(contents:subject)%0a%0a%(contents:body)' > tag-message.md
          fi
          echo "Tag message:"; cat tag-message.md

          # --first-parent keeps the commits made directly on main; commits inside
          # pull requests are covered by the PR list. Squash-merged PRs end in
          # "(#123)" and are listed by GitHub as well.
          git log --first-parent --no-merges --format='%an%x09%s' "$RANGE" \
            | awk -F '\t' '$1 != "github-actions[bot]" { print $2 }' \
            | grep -Ev '\(#[0-9]+\)$' \
            | sed 's/^/* /' > direct-commits.md || true

          # Let GitHub generate the PR part for the same range.
          if [ -n "$PREVIOUS_TAG" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS_TAG" --jq .body > generated-notes.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body > generated-notes.md
          fi

          python3 - <<'PY'
          import re

          commits = open("direct-commits.md", encoding="utf-8").read().strip()
          tag_message = open("tag-message.md", encoding="utf-8").read().strip()
          generated = open("generated-notes.md", encoding="utf-8").read()

          # GitHub's body: "## What's Changed" with the PR list, optionally
          # "## New Contributors", and a closing "**Full Changelog**" line.
          prs, rest = [], []
          section = None
          for line in generated.splitlines():
              if re.match(r"^##\s+What's Changed", line):
                  section = "prs"
                  continue
              if line.startswith("## ") or line.startswith("**Full Changelog**"):
                  section = "rest"
              if section == "prs":
                  if line.strip():
                      prs.append(line)
              elif line.strip() or rest:
                  rest.append(line)

          parts = []
          if tag_message:
              parts.append(tag_message)
          if commits or prs:
              parts.append("## What's Changed")
              if commits:
                  parts.append("### Commits on main\n" + commits)
              if prs:
                  parts.append("### Merged PRs\n" + "\n".join(prs))
          if rest:
              parts.append("\n".join(rest).strip())

          with open("release-notes.md", "w", encoding="utf-8") as out:
              out.write("\n\n".join(parts) + "\n")
          PY

          cat release-notes.md

      - name: Download Windows artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: windows-zip
          path: release-assets/windows

      - name: Download Windows MSI artifact
        if: ${{ !startsWith(github.ref_name, 'beta-') }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: windows-msi
          path: release-assets/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: linux-appimage
          path: release-assets/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: macos-dmg-*
          merge-multiple: true
          path: release-assets/macos

      - name: Download Debian artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: linux-debian
          path: release-assets/debian

      - name: Download Fedora artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: linux-fedora
          path: release-assets/fedora

      - name: Download Arch Linux artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: linux-arch
          path: release-assets/archlinux

      - name: Download flatpakref
        uses: actions/download-artifact@v8.0.2
        with:
          name: flatpakref
          path: release-assets/flatpakref

      - name: Download PDF manuals
        uses: actions/download-artifact@v8.0.2
        with:
          name: docs-pdf
          path: release-assets/docs

      - name: Create tagged release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ startsWith(github.ref_name, 'beta-') && format('Beta {0}', github.ref_name) || format('Release {0}', github.ref_name) }}
          prerelease: ${{ startsWith(github.ref_name, 'beta-') }}
          allowUpdates: false
          replacesArtifacts: false
          makeLatest: ${{ !startsWith(github.ref_name, 'beta-') }}
          bodyFile: release-notes.md
          generateReleaseNotes: false
          # The MSI entry is absent for beta tags (the Windows job skips it);
          # artifactErrorsFailBuild is left at its default, so a missing path
          # only warns and the release still gets every other asset.
          artifacts: >-
            release-assets/windows/praktiKST-${{ github.ref_name }}-windows-x64.zip,
            release-assets/windows/KST4Contest-${{ github.ref_name }}-windows-x64.msi,
            release-assets/linux/KST4Contest-${{ github.ref_name }}-linux-x86_64.AppImage,
            release-assets/debian/KST4Contest-${{ github.ref_name }}-debian-amd64.deb,
            release-assets/fedora/KST4Contest-${{ github.ref_name }}-fedora-x86_64.rpm,
            release-assets/archlinux/KST4Contest-${{ github.ref_name }}-archlinux-*.pkg.tar.zst,
            release-assets/flatpakref/*.flatpakref,
            release-assets/macos/KST4Contest-${{ github.ref_name }}-macos-*.dmg,
            release-assets/docs/KST4Contest-${{ github.ref_name }}-manual-en.pdf,
            release-assets/docs/KST4Contest-${{ github.ref_name }}-manual-de.pdf

      # The update feed is generated only after GitHub has published the
      # release. Otherwise the Releases API cannot return the release notes
      # belonging to the tag which triggered this workflow.
      - name: Set up Node.js for website build
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build and validate website after release publication
        working-directory: website
        run: |
          npm ci
          npm test
          npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Stable release in update feed
        if: ${{ !startsWith(github.ref_name, 'beta-') }}
        working-directory: website
        run: npm run validate:version-info
        env:
          EXPECTED_STABLE_VERSION: ${{ github.ref_name }}

      - name: Attach verified version info to tagged release
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          website/_site/kst4ContestVersionInfo.xml
          --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload verified website artifact
        uses: actions/upload-artifact@v7
        with:
          name: kst4contest-website-${{ github.ref_name }}
          path: website/_site/
          if-no-files-found: error
          retention-days: 14
