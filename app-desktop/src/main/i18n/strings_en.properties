# The base language. Every key and every argument count comes from this file.
#
# To contribute a language: copy this file to strings_<code>.properties and translate the
# values to the right of the equals sign. An untranslated key falls back to English, so a
# partial file is welcome. `./gradlew :app-desktop:classes` builds and reports any mistake,
# and writes a worksheet of what is still missing to
# app-desktop/build/generated/i18n/todo/.
#
# Nothing that goes to the ON4KST server or to other radio amateurs belongs in this file --
# none of it is here, and three tests keep it that way.
